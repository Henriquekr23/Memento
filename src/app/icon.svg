<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#201e1d"/>
  <!-- Mesmo desenho de `components/Logo.tsx` — as duas fotos empilhadas fora de
       esquadro —, aqui com cores fixas: a aba do navegador não herda nada da
       página, então não dá para usar `currentColor`.

       O grupo recentraliza e encolhe a marca: o desenho do componente ocupa a
       moldura inteira, e aqui precisa de respiro até o canto arredondado. O
       traço da foto de trás vai de 1.6 para 2.2 e a opacidade de 0.45 para
       0.62 porque a 16px, na aba, o valor original some. -->
  <g transform="translate(16 16) scale(0.84) translate(-14.7 -15.6)">
    <rect x="4.5" y="8.5" width="14" height="18" rx="3"
          transform="rotate(11 11.5 17.5)"
          fill="none" stroke="#c67139" stroke-width="2.2" opacity="0.62"/>
    <rect x="11" y="4.5" width="14" height="18" rx="3"
          transform="rotate(-10 18 13.5)" fill="#c67139"/>
  </g>
</svg>
